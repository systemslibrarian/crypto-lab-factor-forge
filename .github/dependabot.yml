# Grouped so an ecosystem's routine bumps arrive as ONE pull request instead of
# one per dependency. Ungrouped, this fleet opened 1,461 PRs across 176 repos,
# none of which had any CI signal because the only workflow fired on push.
#
# Majors are deliberately left OUT of the npm group. When the 2026-08-18
# backlog was landed by hand, 109 bumps had to be held back and they were
# overwhelmingly majors; grouping a breaking major together with the safe bumps
# makes the whole PR unmergeable, which is the hand-unpicking this exists to
# prevent.
#
# github-actions majors ARE grouped: the checkout/setup-node/Pages jumps were
# verified green across the fleet.
#
# What "left out of the group" does and does not mean, because the two halves of
# this policy are easy to read as contradicting each other. Ungrouping a major
# only decides how it ARRIVES: on its own, so one breaking bump cannot make the
# whole batch unmergeable. It does not hold it back. The auto-merge job in
# deploy.yml merges any pull request whose gate went green, major or not, and
# that is deliberate: the gate -- unit suite, build, claims on four browser
# engines, and the WCAG scans -- judges a bump far better than its version
# number does. A major that actually breaks this lab fails the gate and stays
# open for a human.
#
# This was exercised on 2026-09-08, when vite 8, TypeScript 7, vitest 5 and
# dependabot/fetch-metadata 3 all arrived as separate majors, all passed, and
# all merged. Vitest 5 closed GHSA-82fw-gwwq-j7x9 as a side effect; see
# SECURITY.md.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      npm-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # This ecosystem is also what makes the SHA pins in deploy.yml maintainable
  # rather than a slow decay. Dependabot understands the
  # `uses: owner/repo@<sha> # vX.Y.Z` form and rewrites BOTH halves — the SHA
  # and the trailing tag comment — so pinning to an immutable commit costs
  # nothing in currency. Without this ecosystem configured, pinned actions
  # would simply never be updated again.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"
